<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Demo method GET</title>
</head>
<body>

    <h3>Demo method GET:</h3>
    
    <!-- Form dengan method GET -->
    <form action="" method="GET">
        <label for="nama">Nama : </label>
        <input type="text" id="nama" name="nama" value="Aditia Ardiansyah"><br><br>

        <label for="username">Username : </label>
        <input type="text" id="username" name="username" value="aditia"><br><br>

        <label for="password">Password : </label>
        <input type="password" id="password" name="password" value="rahasia123"><br><br>

        <button type="submit">Simpan</button>
    </form>

</body>
</html>
