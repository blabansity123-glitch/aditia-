<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Formulir Peserta</title>
</head>
<body>

    <!-- Menggunakan fieldset dan legend untuk garis bingkai judul -->
    <fieldset style="width: 650px;">
        <legend><b>Formulir Peserta</b></legend>
        
        <form action="" method="POST">
            <!-- Nama -->
            <label for="nama">Nama : </label>
            <input type="text" id="nama" name="nama" value="Muhammad Thaariq"><br><br>

            <!-- Username -->
            <label for="username">Username : </label>
            <input type="text" id="username" name="username" value="thaariq"><br><br>

            <!-- Password (menggunakan type="text" agar tampil jelas) -->
            <label for="password">Password : </label>
            <input type="text" id="password" name="password" value="rahasia123"><br><br>

            <!-- Jenis Kelamin (Radio Button) -->
            <label>Jenis Kelamin : </label>
            <input type="radio" id="jk_pria" name="jenkel" value="Laki-laki" checked>
            <label for="jk_pria">Laki-laki</label>
            
            <input type="radio" id="jk_wanita" name="jenkel" value="Perempuan">
            <label for="jk_wanita">Perempuan</label><br><br>

            <!-- Tanggal Lahir -->
            <label for="tgl_lahir">Tanggal Lahir : </label>
            <input type="date" id="tgl_lahir" name="tgl_lahir" value="2006-12-05"><br><br>

            <!-- Agama (Select Dropdown) -->
            <label for="agama">Agama : </label>
            <select id="agama" name="agama">
                <option value="Islam" selected>Islam</option>
                <option value="Kristen">Kristen</option>
                <option value="Katolik">Katolik</option>
                <option value="Hindu">Hindu</option>
                <option value="Buddha">Buddha</option>
                <option value="Konghucu">Konghucu</option>
            </select><br><br>

            <!-- Email (menggunakan type="email" dengan data tidak lengkap untuk pengujian validasi) -->
            <label for="email">Email : </label>
            <input type="email" id="email" name="email" value="thaariq@"><br><br>

            <!-- Pilih Course (Checkbox) -->
            <label>Pilih Course: </label>
            <input type="checkbox" id="web_native" name="course" value="Web Native" checked>
            <label for="web_native">Web Native</label>
            
            <input type="checkbox" id="web_fw" name="course" value="Web Framework">
            <label for="web_fw">Web Framework</label>
            
            <input type="checkbox" id="mobile_native" name="course" value="Mobile Native" checked>
            <label for="mobile_native">Mobile Native</label>
            
            <input type="checkbox" id="mobile_cross" name="course" value="Mobile Lintas Platform">
            <label for="mobile_cross">Mobile Lintas Platform</label><br><br>

            <!-- Alamat (Textarea) -->
            <label>Alamat : </label><br>
            <textarea id="alamat" name="alamat" rows="6" cols="50">Jl. Veteran No. 5, Malang</textarea><br><br>

            <!-- Tombol Daftar -->
            <button type="submit">Daftar</button>
        </form>
    </fieldset>

</body>
</html>
