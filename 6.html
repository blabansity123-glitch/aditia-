<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Formulir Alamat - Perbaikan</title>
    <style>
        /* Gaya CSS sesuai spesifikasi perbaikan */
        #alamat {
            font-size: 16px;
            color: rgb(34, 34, 34);
        }
    </style>
</head>
<body>

    <form action="" method="GET">
        <label for="alamat">Alamat:</label><br><br>
        
        <!-- Textarea dengan atribut maxlength dan ukuran gaya CSS -->
        <textarea id="alamat" name="alamat" rows="4" cols="40" maxlength="200">Jl. Soekarno Hatta No. 10
RT 02 RW 05, Lowokwaru
Malang, Jawa Timur</textarea><br>

        <small>Maksimal 200 karakter. Tekan Enter untuk baris baru.</small><br><br>

        <button type="submit">Kirim</button>
    </form>

</body>
</html>
