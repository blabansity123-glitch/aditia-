<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Formulir Alamat</title>
</head>
<body>

    <!-- Form dengan atribut action menuju latihan.html dan method GET -->
    <form action="latihan.html" method="GET">
        <label for="alamat">Alamat:</label><br><br>
        
        <!-- Textarea dengan nilai default -->
        <textarea id="alamat" name="alamat" rows="5" cols="30">Jl. surabaya raya No. 10</textarea><br><br>

        <button type="submit">Kirim</button>
    </form>

</body>
</html>
