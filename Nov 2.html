
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Interaktif</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 600px;
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            color: #333;
            margin-bottom: 15px;
            font-size: 30px;
        }

        p {
            color: #666;
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 13px 24px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        #btnUbah {
            background: #667eea;
            color: white;
        }

        #btnReset {
            background: #eeeeee;
            color: #333;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
        }

        footer {
            margin-top: 30px;
            color: #999;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="icon">💻</div>

        <h1 id="judul">Selamat Datang!</h1>

        <p id="deskripsi">
            Ini adalah website interaktif pertama saya.
            Klik tombol di bawah untuk mencoba JavaScript.
        </p>

        <div class="buttons">
            <button id="btnUbah">✨ Ubah Teks</button>
            <button id="btnReset">↩ Reset</button>
        </div>

        <footer>
            Dibuat dengan HTML, CSS, dan JavaScript
        </footer>
    </div>

    <script src="script.js"></script>

</body>
</html>
